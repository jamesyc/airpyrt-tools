name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: Tests and packaging
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install project and development tools
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[dev]"

      - name: Run tests with coverage
        run: |
          python -m coverage run -m pytest
          python -m coverage report

      - name: Compile package source
        run: python -m compileall -q acp

      - name: Lint cleaned Python surfaces
        if: matrix.python-version == '3.11'
        run: python -m ruff check acp/cli.py acp/srp.py setup.py tests

      - name: Build distributions
        if: matrix.python-version == '3.11'
        run: python -m build

      - name: Check distribution metadata
        if: matrix.python-version == '3.11'
        run: python -m twine check dist/*

      - name: Install wheel
        if: matrix.python-version == '3.11'
        run: python -m pip install --force-reinstall dist/*.whl

      - name: Check installed dependencies
        if: matrix.python-version == '3.11'
        run: python -m pip check
